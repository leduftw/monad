name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - run: dotnet restore Monad.slnx --locked-mode
      - name: Verify formatting
        if: runner.os == 'Linux'
        run: dotnet format Monad.slnx --no-restore --verify-no-changes
      - run: dotnet build Monad.slnx --configuration Release --no-restore
      - run: dotnet test Monad.slnx --configuration Release --no-build

  package:
    name: Package (${{ matrix.rid }})
    if: github.event_name == 'push'
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: osx-arm64
            os: macos-15
          - rid: osx-x64
            os: macos-15-intel
          - rid: linux-arm64
            os: ubuntu-22.04-arm
          - rid: linux-x64
            os: ubuntu-22.04
          - rid: win-arm64
            os: windows-11-arm
          - rid: win-x64
            os: windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - name: Install Linux capture client
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes pulseaudio-utils
      - name: Package
        shell: bash
        run: ./scripts/package-release.sh "${{ matrix.rid }}" artifacts
      - name: Smoke-test archive
        shell: bash
        run: ./scripts/smoke-package.sh "${{ matrix.rid }}" artifacts/* "$(sed -n 's:.*<Version>\([^<][^<]*\)</Version>.*:\1:p' Monad/Monad.csproj)"
      - name: Smoke-test Unix installer
        if: runner.os != 'Windows'
        shell: bash
        run: ./scripts/smoke-installer.sh artifacts
      - name: Smoke-test Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/smoke-installer.ps1 artifacts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: monad-${{ matrix.rid }}-${{ github.sha }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
